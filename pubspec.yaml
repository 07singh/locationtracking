
name: flutter_location_app
description: A Flutter project for real-time location tracking with MVVM and Riverpod.

publish_to: 'none' # Remove this line if you intend to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  permission_handler: ^11.0.1
  geolocator: ^13.0.1
  google_maps_flutter: ^2.7.0
  http: ^1.2.0
  intl: ^0.19.0
  flutter_riverpod: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

